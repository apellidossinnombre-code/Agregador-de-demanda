<style>
:root{--bg:#000;--sf:#0b0f1a;--sf2:#121a2b;--tx:#eaf0ff;--mu:#8c98b4;--ln:#1c2740;--co:#6f9bff;--te:#3fd6bb;--am:#ffb84d;--rd:#ff6b6b;

.w{max-width:1100px;margin:0 auto;padding:0 20px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar .w{display:flex;align-items:center;gap:22px;height:56px}.bar b{font-size:17px;display:flex;gap:9px;align-items:center}.bar svg{width:26px;height:26px;color:var(--co)}

.hero{position:relative;overflow:hidden;color:#fff;min-height:440px;display:flex;align-items:flex-end;background:linear-gradient(180deg,#020512,#071a4d)}

.hero .horizon{position:absolute;left:50%;bottom:-120%;width:170%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#04103a 62%,#0c2a7a);box-shadow:0 -3px 70px #5b8cffaa,inset 0 30px 80px #2f6bff66}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.2) 70%),linear-gradient(0deg,#000,transparent 45%)}
.hero .in{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;padding:64px 20px 34px}
.hero h1{margin:10px 0 6px;font-size:clamp(28px,5.2vw,54px);line-height:1.08;max-width:20ch;text-wrap:balance}.hero p{margin:0 0 22px;font-size:17px;opacity:.88}
.live{display:inline-flex;gap:8px;align-items:center;font-size:14px}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rd)}

.hero .tg{border-color:rgba(255,255,255,.35)}.tg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mu))}

.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}@media(max-width:700px){.st{grid-template-columns:1fr 1fr}}
.st div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}.st b{display:block;font-size:28px}.st span{color:var(--mu);font-size:13px}
.ask{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:34px}

.ask form{display:flex;gap:8px}.ask input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--ln);border-radius:99px;color:var(--tx);padding:9px 16px;font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips button{background:transparent;border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}.chips button:hover{color:var(--tx);border-color:var(--co)}
#ans{margin-top:12px}#ans p{margin:0 0 4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:36px}@media(max-width:780px){.cols{grid-template-columns:1fr}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:4px}.sh h2{margin:0;font-size:21px}.sh i{width:12px;height:12px;border-radius:50%;background:var(--c)}.sh a,.sh span{margin-left:auto;font-size:13px;color:var(--mu)}.sh a:hover{color:var(--co)}

.it{display:grid;grid-template-columns:84px 1fr 60px;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:start}.it:hover h3{color:var(--co)}
.th{position:relative;overflow:hidden;width:84px;height:84px;border-radius:12px;display:grid;place-items:center;color:#ffffffaa;background:linear-gradient(135deg,hsl(var(--h) 65% 38%),hsl(calc(var(--h) + 45) 70% 18%))}
.th svg{width:34px;height:34px}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it h3{margin:0;font-size:16px;line-height:1.25}.it p{margin:2px 0 8px;color:var(--mu);font-size:14px}
.dt{text-align:center;color:var(--mu);font-size:12px;line-height:1.2}.dt strong{display:block;font-size:26px;color:var(--tx)}
.news{margin-top:44px}.ng{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:12px}
.ng .th{width:100%;height:auto;aspect-ratio:16/9}.ng h3{margin:10px 0 4px;font-size:16px;line-height:1.3}.ng small{color:var(--mu)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 8px}.ctl input{flex:1;min-width:200px;background:var(--sf);border:1px solid var(--ln);border-radius:99px;color:var(--tx);padding:9px 16px;font:inherit}
.ctl button{background:var(--sf);border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:8px 14px;font:inherit;cursor:pointer}.ctl button.on{color:#001033;background:var(--co);border-color:var(--co)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:26px 0}.facts div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 16px}
.facts dt{color:var(--mu);font-size:13px}.facts dd{margin:2px 0 0;font-weight:600}
.back{display:inline-block;margin:20px 0 0;color:var(--mu)}.back:hover{color:var(--tx)}
.txt{max-width:70ch;color:#cdd6ee}.why li{color:var(--mu);margin:2px 0}
footer{border-top:1px solid var(--ln);margin-top:50px;padding:22px 0 34px;color:var(--mu);font-size:12.5px}
.bar nav{overflow-x:auto;white-space:nowrap;scrollbar-width:none}.bar .w{gap:16px}
.map{height:480px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:#050b1c}.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}.leaflet-container{background:#050b1c;font:inherit}
.vid{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin:14px 0}.vid iframe{width:100%;height:100%;border:0}
.ctl select{background:var(--sf);border:1px solid var(--ln);border-radius:99px;color:var(--tx);padding:9px 16px;font:inherit;max-width:100%}.ctl input{min-width:130px}
.bar nav button{background:none;border:0;color:var(--mu);font:inherit;cursor:pointer;padding:0}.bar nav button.on,.bar nav button:hover{color:var(--tx)}
.dd{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:0;right:0;z-index:6;background:var(--sf);border-bottom:1px solid var(--ln)}.dd .w{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px}
.pl{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--mu);background:var(--sf)}.pl:hover{color:var(--tx)}.pl.on{background:var(--co);border-color:var(--co);color:#001033}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}.ic{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}.ic h3{margin:0}.ic .s{color:var(--mu);font-size:13.5px}.ic p{margin:8px 0}
.ic dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}.ic dt{color:var(--mu)}.ic dd{margin:0}
.gl dt{font-weight:600;margin-top:14px}.gl dd{margin:2px 0 0;color:#cdd6ee;max-width:70ch}.ph{list-style:none;padding:0;max-width:800px}.ph li{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln)}
.ph2{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:10px}.ic img.lg{height:44px;width:auto;max-width:140px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;margin-bottom:8px}.lk a{margin-right:14px;color:var(--co);font-size:13.5px}
.ibar{background:radial-gradient(90% 140% at 85% 0,#2f6bff44,transparent 60%),linear-gradient(180deg,#040a1f,#0a1a4a);border-bottom:1px solid var(--ln);padding:30px 0 18px}.ibar h1{margin:0 0 4px;font-size:clamp(26px,4vw,38px)}.ibar p{margin:0 0 16px;color:#b9c6e8}.ibar .ctl{margin:0}
.ic{padding:0;border-radius:18px;overflow:hidden;transition:border-color .2s,transform .2s}.ic:hover{border-color:var(--co);transform:translateY(-2px)}
.mh{position:relative;height:150px;display:grid;place-items:center;color:#ffffff88;background:linear-gradient(135deg,hsl(var(--h) 65% 38%),hsl(calc(var(--h) + 45) 70% 16%))}.mh svg{width:52px;height:52px}.mh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mh::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,15,26,.85),transparent 55%)}
.st{position:absolute;z-index:1;top:10px;left:10px;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#cdd6ee;backdrop-filter:blur(6px)}.st.on{color:var(--te)}.st.re{left:auto;right:10px;color:var(--co)}
.bd{padding:16px}.bd h3{margin:0;font-size:18px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kp div{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:8px 12px}.kp b{display:block;font-family:Sora,sans-serif;font-size:17px}.kp span{color:var(--mu);font-size:12.5px}
.sb{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--ln);margin-top:4px}.sl{color:var(--mu);font-size:12.5px;margin:4px 0 8px}
.ds{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;color:#cdd6ee}.ds.open{-webkit-line-clamp:unset;display:block}
.ah{display:flex;gap:12px;align-items:center}.lg{position:relative;flex:none;width:56px;height:56px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 65% 38%),hsl(calc(var(--h) + 45) 70% 18%))}.lg em{font-style:normal;font-weight:700;font-size:15px;color:#fff}.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
.tp{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.cp{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.cp span{font-size:12.5px;border:1px solid var(--ln);border-radius:99px;padding:1px 9px;color:#cdd6ee}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<body>
<header class="bar"><div class="w">
<b><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="14" cy="14" r="4.5" fill="currentColor"/><ellipse cx="14" cy="14" rx="12" ry="5" transform="rotate(-25 14 14)"/></svg>Lanzamientos europeos</b>
<nav><a href="#/">Inicio</a><a href="#/lanzamientos">Lanzamientos</a><a href="#/mapa">Mapa</a><a href="#/en-vivo">En vivo</a><a href="#/seguimiento">Seguimiento</a><a href="#/herramientas">Dónde ver</a><button id="ib" aria-expanded="false" aria-controls="dd">Información ▾</button><a href="#/noticias">Noticias</a><a href="#/avisos">Avisos</a></nav><span class="sp"></span><small id="notice">Cargando…</small>
</div></header>
<div class="dd" id="dd" hidden><div class="w"></div></div>
<div id="app"></div>
<footer><div class="w">Agencia Espacial Española, herramienta interna. Las imágenes pertenecen a sus autores y fuentes.</div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const https=u=>/^https:\/\//.test(u||"")?esc(u):"";
const hue=s=>[...String(s||"x")].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const ROCKET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2c3 2.5 4.5 6 4.5 10l-2 3h-5l-2-3c0-4 1.5-7.5 4.5-10zM9.5 15l-3 3 1 3 3-2M14.5 15l3 3-1 3-3-2"/><circle cx="12" cy="9.5" r="1.6" fill="currentColor"/></svg>';
const thumb=(img,h)=>`<div class="th" style="--h:${h}">${ROCKET}${https(img)?`<img src="${https(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`;
const utc=iso=>iso?new Date(iso).toLocaleString("es-ES",{dateStyle:"full",timeStyle:"short",timeZone:"UTC"})+" UTC":"Fecha por determinar";
const loc=iso=>iso?new Date(iso).toLocaleString("es-ES",{dateStyle:"full",timeStyle:"short"}):"Fecha por determinar";
const rel=iso=>{const d=Math.ceil((new Date(iso)-Date.now())/864e5);return d<=0?"hoy":d==1?"mañana":"en "+d+" días"};
const ST={Go:["Confirmado","te"],TBC:["Por confirmar","am"],TBD:["Fecha por determinar","mu"],Hold:["En espera","am"]};
const stat=s=>ST[s]?`<span style="color:var(--${ST[s][1]})">${ST[s][0]}</span>`:esc(s);
const tags=l=>`<span class="tg ${l.vehEU?"v":"n"}">${l.vehEU?"Lanzador europeo":"Lanzador no europeo"}</span><span class="tg ${l.payEU?"p":"n"}">${l.payEU?"Carga europea":"Carga no europea"}</span>`;
const row=l=>{const d=new Date(l.date);return `<a class="it" href="#/lanzamiento/${encodeURIComponent(l.id)}">${thumb(l.image,hue(l.provider||l.vehicle))}<div><h3>${esc(l.name)}</h3><p>${esc(l.vehicle)}${l.payload?", "+esc(l.payload):""}<br>${esc(l.location||l.pad)}</p>${tags(l)}${l.status?`<span class="tg">${stat(l.status)}</span>`:""}</div><div class="dt"><strong>${d.getDate()}</strong>${d.toLocaleString("es-ES",{month:"short"})}<br>${rel(l.date)}</div></a>`};
(()=>{})();
let S={L:[],N:[],updatedAt:null,stale:false},ALL=[],next=null;
const stars=()=>{let s=7,o=[];const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<90;i++)o.push(`${(r()*100).toFixed(1)}vw ${Math.floor(r()*520)}px 0 ${r()>.8?1:0}px rgba(255,255,255,${(.3+r()*.7).toFixed(2)})`);return o.join(",")};
function hero(l,detail){
 if(!l)return `<section class="hero"><div class="horizon"></div><div class="in"><h1>Sin lanzamientos europeos programados</h1><p>Los datos se actualizan automáticamente.</p></div></section>`;
 next=l;
 return `<section class="hero">${https(l.image)?`<img class="bg" src="${https(l.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:'<div class="horizon"></div>'}<div class="stars" style="box-shadow:${stars()}"></div><div class="in"><span class="live">${detail?"Lanzamiento":"Próximo lanzamiento europeo"}</span><h1>${esc(l.name)}</h1><p>${esc(l.vehicle)}${l.payload?", "+esc(l.payload):""}. ${esc(l.location||l.pad)}</p><div class="cd" id="cd"></div><div class="meta">${tags(l)}<span class="tg">${utc(l.date)}</span>${l.status?`<span class="tg">${stat(l.status)}</span>`:""}${detail?"":`<a class="btn" href="#/lanzamiento/${encodeURIComponent(l.id)}">Ver detalles</a>`}</div></div></section>`}
function tick(){const el=$("#cd");if(!el||!next||!next.date)return;const s=Math.max(0,Math.floor((new Date(next.date)-Date.now())/1000));
 el.innerHTML=[[Math.floor(s/86400),"días"],[Math.floor(s%86400/3600),"horas"],[Math.floor(s%3600/60),"min"],[s%60,"seg"]].map(([n,u])=>`<div><strong>${String(n).padStart(2,"0")}</strong><em>${u}</em></div>`).join("")}
function ask(q){const t=q.toLowerCase(),now=Date.now();let r,m;
 if(/semana|7 d/.test(t)){r=ALL.filter(l=>new Date(l.date)-now<7*864e5);m=r.length?`Hay ${r.length} lanzamientos europeos en los próximos 7 días:`:"No hay lanzamientos europeos previstos en los próximos 7 días."}
 else if(/pr[oó]xim|siguiente|cu[aá]ndo|next/.test(t)){r=ALL.slice(0,1);m=r.length?"El próximo lanzamiento europeo es:":"No hay lanzamientos europeos programados."}
 else if(/carga|misi[oó]n/.test(t)){r=ALL.filter(l=>l.payEU).slice(0,5);m="Próximas misiones con carga europea:"}
 else if(/lanzador|cohete/.test(t)){r=ALL.filter(l=>l.vehEU).slice(0,5);m="Próximos lanzamientos con lanzador europeo:"}
 else{const w=t.split(/[^a-záéíóúñ0-9]+/).filter(x=>x.length>2);r=ALL.filter(l=>w.some(x=>(l.name+" "+l.vehicle+" "+l.payload+" "+l.provider).toLowerCase().includes(x))).slice(0,5);m=r.length?"Esto es lo que he encontrado:":"No he encontrado nada con esa búsqueda. Prueba con el nombre de un cohete o una misión."}
 return `<p>${m}</p>`+r.map(l=>`<p><a href="#/lanzamiento/${encodeURIComponent(l.id)}" style="color:var(--co)">${esc(l.name)}</a>, ${loc(l.date)}</p>`).join("")}
function home(){
 const A=ALL.filter(l=>l.vehEU),B=ALL.filter(l=>l.payEU),m30=ALL.filter(l=>new Date(l.date)-Date.now()<30*864e5).length;
 const emp='<p class="sub">Sin datos</p>';
 return hero(ALL[0])+`<main class="w">
<div class="st"><div><b>${ALL.length}</b><span>lanzamientos europeos próximos</span></div><div><b>${A.length}</b><span>con lanzador europeo</span></div><div><b>${B.length}</b><span>con carga europea</span></div><div><b>${m30}</b><span>en los próximos 30 días</span></div></div>
<section class="ask"><h2>Pregunta sobre los lanzamientos</h2><p class="sub">Consulta los datos cargados en esta página. No es una IA generativa.</p><form id="af"><input id="aq" placeholder="¿Qué lanzamiento europeo es el próximo?" aria-label="Pregunta"><button class="btn">Preguntar</button></form>
<div class="chips"><button>¿Cuál es el próximo lanzamiento?</button><button>¿Qué se lanza esta semana?</button><button>¿Qué misiones europeas hay?</button><button>Ariane 6</button></div><div id="ans"></div></section>
<div class="cols"><section><div class="sh"><i style="--c:var(--co)"></i><h2>Lanzadores europeos</h2><a href="#/lanzamientos">Ver todos</a></div><p class="sub">Con carga europea o no</p>${A.slice(0,6).map(row).join("")||emp}</section>
<section><div class="sh"><i style="--c:var(--te)"></i><h2>Misiones europeas</h2><a href="#/lanzamientos">Ver todas</a></div><p class="sub">Con lanzador europeo o no</p>${B.slice(0,6).map(row).join("")||emp}</section></div>

function closeDD(){const d=$("#dd");if(d){d.hidden=true;$("#ib").setAttribute("aria-expanded","false")}}
function initDD(){$("#dd .w").innerHTML=SUBS.map(([s,t])=>`<a class="pl" href="#/informacion/${s}">${t}</a>`).join("");
 $("#ib").onclick=()=>{const d=$("#dd"),o=d.hidden;d.hidden=!o;$("#ib").setAttribute("aria-expanded",String(o))};
 $("#dd").addEventListener("click",e=>{if(e.target.closest("a"))closeDD()});
 document.addEventListener("click",e=>{if(!e.target.closest("#dd,#ib"))closeDD()});document.addEventListener("keydown",e=>{if(e.key=="Escape")closeDD()})}
function route(){const h=location.hash||"#/",app=$("#app");clearInterval(TM);next=null;
 const k=h.split("/")[1]||"",m=h.match(/^#\/lanzamiento\/(.+)$/),id=m&&decodeURIComponent(m[1]),dl=m&&(ALL.find(x=>String(x.id)==id)||S.L.find(x=>String(x.id)==id)),V={lanzamientos:list,mapa,"en-vivo":vivo,seguimiento:seg,herramientas:herr,noticias:noti,avisos,informacion:()=>info(h.split("/")[2])};
 document.querySelectorAll(".bar nav a").forEach(a=>a.className=a.getAttribute("href")=="#/"+(k=="lanzamiento"?"lanzamientos":k)?"on":"");
 $("#ib").className=k=="informacion"?"on":"";closeDD();app.innerHTML=m?detail(id):(V[k]||home)();if(!m)window.scrollTo(0,0);tick();
 const sq=$("#sq");if(sq){sq.oninput=e=>{F.q=e.target.value;$("#lr").innerHTML=flt().map(row).join("")||'<p class="sub">Ningún lanzamiento coincide con el filtro.</p>'};document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F.f=b.dataset.f;route()})}
 const af=$("#af");if(af){const go=q=>{$("#ans").innerHTML=ask(q)};af.onsubmit=e=>{e.preventDefault();go($("#aq").value)};document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{$("#aq").value=b.textContent;go(b.textContent)})}
 if(k=="mapa")drawMap("map",pads());
 if(k=="seguimiento"){const M=drawMap("map",pads());issTick(M);TM=setInterval(()=>issTick(M),5000)}
 if(k=="en-vivo")document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{LV=b.dataset.v;route()});
 if(k=="herramientas")initHerr();
 if(k=="informacion"){if(!INFO)loadInfo();initInfo(h.split("/")[2])}
 if(dl&&VAL(dl))drawMap("map",[{lat:dl.lat,lon:dl.lon,t:dl.location||dl.pad,html:esc(dl.location||dl.pad)}],{c:[dl.lat,dl.lon],z:6})}
let loaded=false;
function setData(L,N){const t=Date.now()-2*36e5;S={L:L.launches,N:N.news||[],updatedAt:L.updatedAt,stale:L.stale};
 ALL=L.launches.filter(l=>l.date&&new Date(l.date)>t).sort((a,b)=>new Date(a.date)-new Date(b.date));
 $("#notice").textContent=L.updatedAt?`Actualizado a las ${new Date(L.updatedAt).toLocaleTimeString("es-ES",{timeStyle:"short"})}${L.stale?", datos en caché":""}`:"Esperando la primera carga de datos";
 const a=document.activeElement&&document.activeElement.id;const skip=loaded&&(/^#\/(herramientas|en-vivo|seguimiento)/.test(location.hash)||["aq","sq","la","lo","ts","iq"].includes(a));loaded=true;if(!skip)route()}
async function load(){try{const [L,N]=await Promise.all([fetch("./data/launches.json",{cache:"no-cache"}).then(r=>r.json()),fetch("./data/news.json",{cache:"no-cache"}).then(r=>r.json())]);
 L.stale=!!L.updatedAt&&Date.now()-L.updatedAt>90*60e3;setData(L,N)}catch(e){$("#notice").textContent="No se pudieron cargar los datos"}}
initDD();addEventListener("hashchange",route);load();setInterval(load,5*60e3);setInterval(tick,1000);
</script>
</body>
</html>

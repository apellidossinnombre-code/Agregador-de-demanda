<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const https=u=>/^https:\/\//.test(u||"")?esc(u):"";
const hue=s=>[...String(s||"x")].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const ROCKET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2c3 2.5 4.5 6 4.5 10l-2 3h-5l-2-3c0-4 1.5-7.5 4.5-10zM9.5 15l-3 3 1 3 3-2M14.5 15l3 3-1 3-3-2"/><circle cx="12" cy="9.5" r="1.6" fill="currentColor"/></svg>';
const thumb=(img,h)=>`<div class="th" style="--h:${h}">${ROCKET}${https(img)?`<img src="${https(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`;
const utc=iso=>iso?new Date(iso).toLocaleString("es-ES",{dateStyle:"full",timeStyle:"short",timeZone:"UTC"})+" UTC":"Fecha por determinar";
const loc=iso=>iso?new Date(iso).toLocaleString("es-ES",{dateStyle:"full",timeStyle:"short"}):"Fecha por determinar";
const rel=iso=>{const d=Math.ceil((new Date(iso)-Date.now())/864e5);return d<=0?"hoy":d==1?"mañana":"en "+d+" días"};
const ST={Go:["Confirmado","te"],TBC:["Por confirmar","am"],TBD:["Fecha por determinar","mu"],Hold:["En espera","am"],Success:["Éxito","te"],Failure:["Fallo","rd"],"Partial Failure":["Fallo parcial","am"],"In Flight":["En vuelo","co"]};
const VOC=[[/Low Earth Orbit/g,"Órbita terrestre baja"],[/Sun-Synchronous Orbit/g,"Órbita heliosíncrona"],[/Geostationary Transfer Orbit/g,"Órbita de transferencia geoestacionaria"],[/Geostationary Orbit/g,"Órbita geoestacionaria"],[/Medium Earth Orbit/g,"Órbita terrestre media"],[/Polar Orbit/g,"Órbita polar"],[/Highly Elliptical Orbit/g,"Órbita muy elíptica"],[/Lunar Orbit/g,"Órbita lunar"],[/Heliocentric Orbit/g,"Órbita heliocéntrica"],[/Suborbital/g,"Suborbital"],
[/Earth Science/g,"Ciencias de la Tierra"],[/Communications/g,"Comunicaciones"],[/Navigation/g,"Navegación"],[/Planetary Science/g,"Ciencias planetarias"],[/Astrophysics/g,"Astrofísica"],[/Technology Development/g,"Desarrollo tecnológico"],[/Test Flight/g,"Vuelo de prueba"],[/Government\/Top Secret/g,"Gubernamental o reservada"],[/Human Exploration/g,"Exploración tripulada"],[/Resupply/g,"Reabastecimiento"],[/Dedicated Rideshare/g,"Lanzamiento compartido dedicado"],[/Robotic Exploration/g,"Exploración robótica"],[/Heliophysics/g,"Heliofísica"],[/Tourism/g,"Turismo"],
[/Space Launch Complex/g,"Complejo de lanzamiento espacial"],[/Launch Complex/g,"Complejo de lanzamiento"],[/Launch Area/g,"Área de lanzamiento"],[/Launch Pad/g,"Plataforma de lanzamiento"],[/Space Center/g,"Centro espacial"],[/Space Centre/g,"Centro espacial"],[/Spaceport/g,"Puerto espacial"],[/Air Force Base/g,"Base de la Fuerza Aérea"],[/Unknown Pad/g,"Plataforma sin determinar"],[/Unknown Payload/g,"Carga sin determinar"],
[/French Guiana/g,"Guayana Francesa"],[/Spain/g,"España"],[/Norway/g,"Noruega"],[/USA/g,"EE. UU."],[/New Zealand/g,"Nueva Zelanda"],[/Russia/g,"Rusia"],[/Japan/g,"Japón"],[/Kazakhstan/g,"Kazajistán"],[/United Kingdom/g,"Reino Unido"],[/Scotland/g,"Escocia"],[/Germany/g,"Alemania"],[/Italy/g,"Italia"],[/Sweden/g,"Suecia"],[/Australia/g,"Australia"]];
const T=s=>VOC.reduce((a,[r,t])=>a.replace(r,t),String(s||""));
const stat=s=>ST[s]?`<span style="color:var(--${ST[s][1]})">${ST[s][0]}</span>`:esc(s);
const tags=l=>`<span class="tg ${l.vehEU?"v":"n"}">${l.vehEU?"Lanzador europeo":"Lanzador no europeo"}</span><span class="tg ${l.payEU?"p":"n"}">${l.payEU?"Carga europea":"Carga no europea"}</span>`;
const row=l=>{const d=new Date(l.date);return `<a class="it" href="#/lanzamiento/${encodeURIComponent(l.id)}">${thumb(l.image,hue(l.provider||l.vehicle))}<div><h3>${esc(l.name)}</h3><p>${esc(l.vehicle)}${l.payload?", "+esc(l.payload):""}<br>${esc(T(l.location||l.pad))}</p>${tags(l)}${l.status?`<span class="tg">${stat(l.status)}</span>`:""}</div><div class="dt"><strong>${d.getDate()}</strong>${d.toLocaleString("es-ES",{month:"short"})}<br>${rel(l.date)}<br>${star(l.id)}</div></a>`};

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanzamientos europeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fc;--sf:#fff;--tx:#0d1b3a;--mu:#5a6785;--ln:#dbe3f2;--co:#2f6bff;--te:#0f9e86;--am:#b36b00;
font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#070d1e;--sf:#0f1830;--tx:#e6ecfb;--mu:#8f9cba;--ln:#1e2b4a;--co:#7aa2ff;--te:#3fd6bb;--am:#ffb84d}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);line-height:1.5}
h1,h2,h3,.dt strong,.cd strong{font-family:Sora,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--sf) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
header b{font-family:Sora,sans-serif;font-size:17px}header .sp{flex:1}header small{color:var(--mu);font-size:13px}
header svg{width:28px;height:28px;color:var(--co)}
.hero{position:relative;overflow:hidden;color:#fff;min-height:440px;display:flex;align-items:flex-end;background:linear-gradient(180deg,#040a1f,#0a2160)}
.hero .stars{position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%;background:transparent}
.hero .horizon{position:absolute;left:50%;bottom:-120%;width:170%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#06113a 62%,#0c2a7a);box-shadow:0 -3px 70px #5b8cffaa,inset 0 30px 80px #2f6bff66}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,31,.9),rgba(4,10,31,.25) 70%),linear-gradient(0deg,rgba(4,10,31,.7),transparent 50%)}
.in{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;padding:60px 20px 36px}
.hero h1{margin:10px 0 6px;font-size:clamp(28px,5.2vw,54px);line-height:1.08;max-width:20ch;text-wrap:balance}
.hero p{margin:0 0 22px;font-size:17px;opacity:.88}
.hero .k{display:inline-flex;gap:8px;align-items:center;font-size:14px;opacity:.9}
.cd{display:flex;gap:10px;flex-wrap:wrap}
.cd div{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 16px;min-width:76px;text-align:center}
.cd strong{display:block;font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1}.cd em{font-style:normal;font-size:12px;opacity:.75}
.meta{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero .tg{border-color:rgba(255,255,255,.35)}
@media(prefers-reduced-motion:no-preference){.hero .in{animation:up .7s both}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
main{max-width:1100px;margin:0 auto;padding:32px 20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:36px}@media(max-width:780px){.cols{grid-template-columns:1fr}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:4px}.sh h2{margin:0;font-size:21px}
.sh i{width:12px;height:12px;border-radius:50%;background:var(--c)}.sh span{margin-left:auto;font-size:13px;color:var(--mu)}
.sub{margin:0 0 6px;color:var(--mu);font-size:14px}
.it{display:grid;grid-template-columns:84px 1fr 56px;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:start}
.th{position:relative;overflow:hidden;width:84px;height:84px;border-radius:12px;display:grid;place-items:center;color:#ffffffaa;background:linear-gradient(135deg,hsl(var(--h) 65% 40%),hsl(calc(var(--h) + 45) 70% 20%))}
.th svg{width:34px;height:34px}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it h3{margin:0;font-size:16px;line-height:1.25}.it p{margin:2px 0 8px;color:var(--mu);font-size:14px}
.dt{text-align:center;color:var(--mu);font-size:12px;line-height:1.2}.dt strong{display:block;font-size:26px;color:var(--tx)}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--ln);margin:0 4px 4px 0}
.tg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mu))}
.v{--c:var(--co)}.p{--c:var(--te)}.n{opacity:.6}
.news{margin-top:44px}.ng{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:12px}
.ng a{color:inherit;text-decoration:none}.ng .th{width:100%;height:auto;aspect-ratio:16/9;border-radius:12px}
.ng h3{margin:10px 0 4px;font-size:16px;line-height:1.3}.ng small{color:var(--mu)}
a:focus-visible{outline:2px solid var(--co);outline-offset:3px}
footer{max-width:1100px;margin:0 auto;padding:8px 20px 32px;color:var(--mu);font-size:12.5px}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="14" cy="14" r="4.5" fill="currentColor"/><ellipse cx="14" cy="14" rx="12" ry="5" transform="rotate(-25 14 14)"/></svg>
<b>Lanzamientos europeos</b><span class="sp"></span><small id="notice">Cargando…</small>
</header>

<section class="hero" id="hero"><div class="horizon"></div><div class="stars" id="stars"></div><div class="in"><h1>Cargando…</h1></div></section>

<main>
<div class="cols">
 <section><div class="sh"><i style="--c:var(--co)"></i><h2>Lanzadores europeos</h2><span id="cL"></span></div><p class="sub">Con carga europea o no</p><div id="colL"></div></section>
 <section><div class="sh"><i style="--c:var(--te)"></i><h2>Misiones europeas</h2><span id="cM"></span></div><p class="sub">Con lanzador europeo o no</p><div id="colM"></div></section>
</div>
<section class="news"><div class="sh"><h2>Noticias de lanzadores</h2></div><div class="ng" id="news"></div></section>
</main>
<footer>Datos: Launch Library 2 (The Space Devs). Noticias: Spaceflight News API. Las imágenes pertenecen a sus autores y fuentes.</footer>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const https=u=>/^https:\/\//.test(u||"")?esc(u):"";
const hue=s=>[...String(s||"x")].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const ROCKET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2c3 2.5 4.5 6 4.5 10l-2 3h-5l-2-3c0-4 1.5-7.5 4.5-10zM9.5 15l-3 3 1 3 3-2M14.5 15l3 3-1 3-3-2"/><circle cx="12" cy="9.5" r="1.6" fill="currentColor"/></svg>';
const thumb=(img,h,cls="")=>`<div class="th ${cls}" style="--h:${h}">${ROCKET}${https(img)?`<img src="${https(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`;
const fmt=iso=>iso?new Date(iso).toLocaleString("es-ES",{dateStyle:"long",timeStyle:"short"}):"Fecha por determinar";
const rel=iso=>{const d=Math.ceil((new Date(iso)-Date.now())/864e5);return d<=0?"hoy":d==1?"mañana":"en "+d+" días"};
const ST={Go:["Confirmado","te"],TBC:["Por confirmar","am"],TBD:["Fecha por determinar","mu"],Hold:["En espera","am"]};
const stat=s=>ST[s]?`<span style="color:var(--${ST[s][1]})">${ST[s][0]}</span>`:esc(s);
const tags=l=>`<span class="tg ${l.vehEU?"v":"n"}">${l.vehEU?"Lanzador europeo":"Lanzador no europeo"}</span><span class="tg ${l.payEU?"p":"n"}">${l.payEU?"Carga europea":"Carga no europea"}</span>`;
const row=l=>{const d=new Date(l.date);return `<article class="it">${thumb(l.image,hue(l.provider||l.vehicle))}<div><h3>${esc(l.name)}</h3><p>${esc(l.vehicle)}${l.payload?", "+esc(l.payload):""}<br>${esc(l.location||l.pad)}</p>${tags(l)}${l.status?`<span class="tg">${stat(l.status)}</span>`:""}</div><div class="dt"><strong>${d.getDate()}</strong>${d.toLocaleString("es-ES",{month:"short"})}<br>${rel(l.date)}</div></article>`};
(()=>{let s=7,o=[];const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<90;i++)o.push(`${(r()*100).toFixed(1)}vw ${Math.floor(r()*520)}px 0 ${r()>.8?1:0}px rgba(255,255,255,${(.3+r()*.7).toFixed(2)})`);$("stars").style.boxShadow=o.join(",")})();
let next=null;
function tick(){if(!next||!next.date)return;const s=Math.max(0,Math.floor((new Date(next.date)-Date.now())/1000)),el=$("cd");
 if(el)el.innerHTML=[[Math.floor(s/86400),"días"],[Math.floor(s%86400/3600),"horas"],[Math.floor(s%3600/60),"min"],[s%60,"seg"]].map(([n,u])=>`<div><strong>${String(n).padStart(2,"0")}</strong><em>${u}</em></div>`).join("")}
function render(L,N){
 const t=Date.now()-2*36e5,eu=L.launches.filter(l=>l.date&&new Date(l.date)>t).sort((a,b)=>new Date(a.date)-new Date(b.date));
 next=eu[0]||null;const h=$("hero");
 h.querySelectorAll(".bg").forEach(e=>e.remove());
 if(next&&https(next.image))h.insertAdjacentHTML("afterbegin",`<img class="bg" src="${https(next.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`);
 h.querySelector(".in").innerHTML=next?`<span class="k">Próximo lanzamiento europeo</span><h1>${esc(next.name)}</h1><p>${esc(next.vehicle)}${next.payload?", "+esc(next.payload):""}. ${esc(next.location||next.pad)}</p><div class="cd" id="cd"></div><div class="meta">${tags(next)}<span class="tg">${fmt(next.date)}</span>${next.status?`<span class="tg">${stat(next.status)}</span>`:""}</div>`:`<h1>Sin lanzamientos europeos programados</h1><p>Los datos se actualizan automáticamente.</p>`;
 const A=eu.filter(l=>l.vehEU),B=eu.filter(l=>l.payEU);
 $("colL").innerHTML=A.map(row).join("")||'<p class="sub">Sin datos</p>';$("colM").innerHTML=B.map(row).join("")||'<p class="sub">Sin datos</p>';
 $("cL").textContent=A.length+" próximos";$("cM").textContent=B.length+" próximas";
 $("news").innerHTML=(N.news||[]).slice(0,6).map(n=>`<a href="${https(n.url)||"#"}" target="_blank" rel="noopener noreferrer"><article>${thumb(n.image,hue(n.site))}<h3>${esc(n.title)}</h3><small>${esc(n.site)}${n.publishedAt?", "+new Date(n.publishedAt).toLocaleDateString("es-ES"):""}</small></article></a>`).join("")||'<p class="sub">Sin noticias</p>';
 $("notice").textContent=L.updatedAt?`Actualizado a las ${new Date(L.updatedAt).toLocaleTimeString("es-ES",{timeStyle:"short"})}${L.stale?", datos en caché":""}`:"Esperando la primera carga de datos";
 tick();
}
async function load(){try{const [L,N]=await Promise.all([fetch("./data/launches.json",{cache:"no-cache"}).then(r=>r.json()),fetch("./data/news.json",{cache:"no-cache"}).then(r=>r.json())]);
 L.stale=!!L.updatedAt&&Date.now()-L.updatedAt>90*60e3;render(L,N)}catch(e){$("notice").textContent="No se pudieron cargar los datos"}}
load();setInterval(load,5*60e3);setInterval(tick,1000);
</script>
</body>
</html>

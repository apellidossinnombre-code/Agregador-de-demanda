name: Actualizar información (agencias y cohetes)
on:
  schedule:
    - cron: '23 3 * * *'    # una vez al día
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-info
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # las peticiones se espacian para respetar el límite de la API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar agencias y cohetes
        env:
          LL2_API_KEY: ${{ secrets.LL2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-info.js
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data config
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar información"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "No se pudo subir el commit"; exit 1

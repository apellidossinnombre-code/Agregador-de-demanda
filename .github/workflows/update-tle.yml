name: Actualizar satélites
on:
  schedule:
    - cron: '37 */4 * * *'    # cada 4 horas
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-tle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar elementos orbitales
        run: node scripts/update-tle.js
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar satélites"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "No se pudo subir el commit"; exit 1
